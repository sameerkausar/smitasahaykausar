name: Check paper filenames

# A PDF whose filename does not match tools/papers.json uploads without error and
# is simply never linked. This makes that mistake visible instead of silent.

on:
  push:
    paths: ['papers/**', 'cv/**', 'tools/papers.json']
  pull_request:
    paths: ['papers/**', 'cv/**', 'tools/papers.json']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_papers.py
